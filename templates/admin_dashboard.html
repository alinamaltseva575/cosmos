{{define "admin_dashboard"}}
<div class="admin-header">
    <h1>👑 Админ-панель Cosmos Explorer</h1>
    <p>Управление контентом сайта</p>
</div>

<div class="admin-stats">
    <div class="stat-card admin-stat">
        <div class="stat-icon">🌍</div>
        <div class="stat-number">{{.PlanetCount}}</div>
        <div class="stat-label">Планет</div>
        <a href="/admin/planets" class="btn-small">Управление</a>
    </div>

    <div class="stat-card admin-stat">
        <div class="stat-icon">🌌</div>
        <div class="stat-number">{{.GalaxyCount}}</div>
        <div class="stat-label">Галактик</div>
        <a href="/admin/galaxies" class="btn-small">Управление</a>
    </div>

    <div class="stat-card admin-stat">
        <div class="stat-icon">👥</div>
        <div class="stat-number">{{.UserCount}}</div>
        <div class="stat-label">Пользователей</div>
        <a href="/admin/users" class="btn-small">Управление</a>
    </div>
</div>

<div class="admin-info">
    <h3>Информация о сессии</h3>
    <p>Вы вошли как: <strong>{{.Username}}</strong></p>
    <p>Роль: <span class="badge admin-badge">{{.Role}}</span></p>
</div>
{{end}}
